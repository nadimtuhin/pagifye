version: '3.8'

services:
  # WordPress Development Environment
  wordpress-dev:
    image: wordpress:6.4-php8.1-apache
    container_name: pagifye-wordpress-dev
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: mysql-dev:3306
      WORDPRESS_DB_NAME: ${MYSQL_DEV_DATABASE:-wordpress_dev}
      WORDPRESS_DB_USER: ${MYSQL_DEV_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_DEV_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('SAVEQUERIES', true);
        define('WP_ENVIRONMENT_TYPE', 'development');
    volumes:
      # Plugin source code (bind mount for live editing)
      - ./plugin:/var/www/html/wp-content/plugins/pagifye-elementor-widgets:delegated
      # WordPress data persistence
      - wp_dev_data:/var/www/html
      # Custom PHP configuration
      - ./docker/wordpress/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      # Xdebug configuration
      - ./docker/wordpress/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    depends_on:
      mysql-dev:
        condition: service_healthy
    networks:
      - pagifye-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL Development Database
  mysql-dev:
    image: mysql:8.0
    container_name: pagifye-mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DEV_DATABASE:-wordpress_dev}
      MYSQL_USER: ${MYSQL_DEV_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_DEV_PASSWORD:-wordpress}
    volumes:
      - db_dev_data:/var/lib/mysql
      - ./docker/mysql/dev.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - pagifye-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # WordPress Testing Environment
  wordpress-test:
    image: wordpress:6.4-php8.1-apache
    container_name: pagifye-wordpress-test
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      WORDPRESS_DB_HOST: mysql-test:3306
      WORDPRESS_DB_NAME: ${MYSQL_TEST_DATABASE:-wordpress_test}
      WORDPRESS_DB_USER: ${MYSQL_TEST_USER:-wordpress_test}
      WORDPRESS_DB_PASSWORD: ${MYSQL_TEST_PASSWORD:-wordpress_test}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'development');
    volumes:
      # Plugin source (read-only for testing)
      - ./plugin:/var/www/html/wp-content/plugins/pagifye-elementor-widgets:ro
      - wp_test_data:/var/www/html
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - pagifye-network
    profiles:
      - testing

  # MySQL Testing Database
  mysql-test:
    image: mysql:8.0
    container_name: pagifye-mysql-test
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-wordpress_test}
      MYSQL_USER: ${MYSQL_TEST_USER:-wordpress_test}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:-wordpress_test}
    volumes:
      - db_test_data:/var/lib/mysql
      - ./docker/mysql/test.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - pagifye-network
    profiles:
      - testing
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin Database Management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pagifye-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-dev
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql-dev
    networks:
      - pagifye-network

  # Node.js Asset Builder
  node-builder:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: pagifye-node-builder
    working_dir: /app
    volumes:
      - ./tailwind:/app:delegated
      - ./plugin/assets:/app/dist:delegated
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"
    networks:
      - pagifye-network

  # WP-CLI Service
  wpcli:
    image: wordpress:cli-php8.1
    container_name: pagifye-wpcli
    user: "33:33" # www-data user
    volumes:
      - wp_dev_data:/var/www/html:rw
      - ./docker/scripts:/scripts:ro
    environment:
      WORDPRESS_DB_HOST: mysql-dev:3306
      WORDPRESS_DB_NAME: ${MYSQL_DEV_DATABASE:-wordpress_dev}
      WORDPRESS_DB_USER: ${MYSQL_DEV_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_DEV_PASSWORD:-wordpress}
    depends_on:
      - wordpress-dev
      - mysql-dev
    networks:
      - pagifye-network
    profiles:
      - cli

# Named Volumes
volumes:
  wp_dev_data:
    name: pagifye_wp_dev_data
  wp_test_data:
    name: pagifye_wp_test_data
  db_dev_data:
    name: pagifye_db_dev_data
  db_test_data:
    name: pagifye_db_test_data
  node_modules:
    name: pagifye_node_modules

# Networks
networks:
  pagifye-network:
    name: pagifye-network
    driver: bridge
